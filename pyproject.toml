[project]
name = "pinn-ulof"
version = "1.0.0"
description = "Companion code for a neural surrogate of the SFR unprotected loss-of-flow transient"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Marco Lanzani", email = "marcolanzani03@gmail.com" }]

# One backend, one optimiser, no extras. The parent study carried three deep-learning
# frameworks because it was comparing them; a companion to the paper carries the one the
# published results were produced with.
# Floors are the versions the published results were produced with, not the oldest that
# might work. `jax>=0.11` in particular: `optax.contrib.schedule_free_eval_params` and the
# `jax.lax.fori_loop` carry semantics this code relies on are not present in the 0.4 series,
# and a floor that admits them would let a fresh environment resolve something that runs and
# gives different numbers.
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "jax>=0.11",
    "equinox>=0.13",
    "optax>=0.2.8",
]

[project.scripts]
pinn-ulof = "pinn_ulof.cli:main"

[dependency-groups]
dev = ["ruff>=0.16.3", "ty>=0.0.71", "pre-commit>=4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinn_ulof"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Physics notation wins over snake_case: `T_f`, `T_cl`, `A_c`, `D_h`, `P_0` are the
    # symbols the SAS4A manual and the paper use, and renaming them would make the code
    # harder to check against its own source.
    "N802", "N803", "N806", "N815", "N816",
    # Formatter conflicts.
    "COM812", "ISC001",
    # A companion repository is read, not extended: TODO-style and complexity rules that
    # exist to police growth are noise here.
    "PLR0913", "PLR0917", "C901", "PLR0912", "PLR0915",
    # Magic numbers are physical constants, and they are documented where they appear.
    "PLR2004",
    # `assert` is not used for control flow in this package.
    "S101",
    # No copyright headers: the licence is in LICENSE, once.
    "CPY001",
    # `print` is how a command line program talks to its user.
    "T201",
]

[tool.ruff.lint.per-file-ignores]
# The command line imports inside each sub-command rather than at module scope, so
# `pinn-ulof --help` does not pay for importing JAX, scipy and matplotlib. That is a
# deliberate policy for one file; stating it here says it once instead of twenty times.
"src/pinn_ulof/cli.py" = ["PLC0415"]
# `matplotlib.use("Agg")` has to run before `pyplot` is imported, which is the one place
# an import cannot come first.
"src/pinn_ulof/model_charts.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src"]
